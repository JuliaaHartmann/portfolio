<div class="modal modal-xl fade" id="projetosModal" tabindex="-1" aria-labelledby="projetosModalLabel"
    aria-hidden="true">

    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="projetoModalLabel">{{ projeto()?.titulo }}</h1>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            </div>

            <div class="modal-body">
                <img class="img-fluid" [src]="projeto()?.urlImagem" [alt]="projeto()?.titulo" />
            </div>

        </div>
    </div>

</div>
